# The checkout's .htaccess files are not read (AllowOverride None is the
# Debian default), so protect data/ here explicitly: it holds the database,
# config.ini.php and media.
<Directory /var/www/html/data>
    Require all denied
</Directory>

# Never serve VCS metadata or dependency sources from the mounted checkout.
<DirectoryMatch "^/var/www/html/(\.git|node_modules|e2e|tests|docker)(/|$)">
    Require all denied
</DirectoryMatch>

# Also listen on 8080 inside the container (not published): the e2e container
# shares this network and the Playwright suites default to http://localhost:8080.
Listen 8080
<VirtualHost *:8080>
    DocumentRoot /var/www/html
</VirtualHost>
